spring.application.name=notification-service

#URL do Eureka Server
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Zipkin server URL
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Sampling rate: 1.0 = 100% of requests traced (use lower in prod, e.g. 0.1)
management.tracing.sampling.probability=1.0

management.tracing.propagation.type=w3c

logging.level.io.micrometer=DEBUG
logging.level.zipkin2=DEBUG

logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

server.port=0


#Quando estiveres a configurar kafka, experimenta usar annotations de serialization no DTO
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.template.default-topic=notificationTopic
spring.kafka.consumer.group-id=notificationId
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.type.mapping=event:com.programming.techie.notification_service.domain.OrderPlacedEvent


